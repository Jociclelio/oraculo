services:
  # =========================================================
  # open-webui — Interface web para LLMs
  # =========================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    network_mode: host
    restart: always
    environment:
      - OAI_API_BASE=http://localhost:8081/v1
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Busca web via SearXNG (metabuscador local)
      - WEBSEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://localhost:8888/search?q=<query>
      # Conexão pré-configurada com o open-terminal (Admin > Integrations)
      - TERMINAL_SERVER_CONNECTIONS=[{"id":"oraculo-terminal","url":"http://localhost:8000","key":"${OPEN_TERMINAL_API_KEY}","name":"Oraculo Terminal","auth_type":"bearer","config":{"access_grants":[]}}]
    volumes:
      # Estado do serviço no repo (data/open-webui) — migração dos volumes
      # nomeados (2026-10-14): webui.db visível/backapeável, sem precedência
      # oculta do banco sobre o env.
      - ./data/open-webui:/app/backend/data
    depends_on:
      - searxng

  # =========================================================
  # open-terminal — Substrato de execução para o Open WebUI
  # =========================================================
  # Shell, filesystem e execução de código que o agente do
  # Open WebUI usa para trabalhar (agentic harness).
  # Conectar em: Settings > Admin > Integrations > Open Terminal
  #   URL: http://localhost:8000 | API Key: OPEN_TERMINAL_API_KEY
  # =========================================================
  open-terminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: open-terminal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
      - ./data/open-terminal:/home/user

  # =========================================================
  # searxng — Metabuscador (busca web para o Open WebUI)
  # =========================================================
  # Porta: http://localhost:8888 (somente localhost)
  # JSON habilitado em ./data/searxng/settings.yml
  # =========================================================
  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./data/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # =========================================================
  # comfyui — Geração/edição de imagens (Qwen-Image 2.1 Turbo)
  # =========================================================
  # Imagem yanwk/comfyui-boot (ComfyUI + Manager, pinada).
  # UI: http://localhost:8188 (gpu-shim: unload de VRAM prévio) | API: /prompt
  # Modelos: ./models/comfyui (diffusion_models/text_encoders/vae)
  # Saídas: /tmp/oraculo-comfyui/output (volátil, some no reboot) | Workflows API p/ Open WebUI: ./comfyui/workflows
  # VRAM COMPARTILHADA: antes de gerar, nenhum container ls-* carregado
  # (ttl 300 do llama-swap descarrega sozinho; unload forçado: ./manage.sh unload).
  # =========================================================
  # Rede host: o gpu-shim (8188) precisa alcançar o llama-swap (:8081) no
  # host p/ unload prévio de VRAM, e o ComfyUI escuta só em 127.0.0.1:8189.
  comfyui:
    image: yanwk/comfyui-boot:cu126-slim-20261019
    container_name: comfyui
    restart: unless-stopped
    network_mode: host
    # Pesos saem da VRAM ao fim de cada geração (libera p/ llama-swap);
    # recarregam da RAM na próxima run (~s), custo irrelevante no turbo 8 passos
    environment:
      - CLI_ARGS=--listen 127.0.0.1 --port 8189 --disable-smart-memory
    gpus: all
    volumes:
      - ./models/comfyui:/root/ComfyUI/models
      - ./comfyui/custom_nodes:/root/ComfyUI/custom_nodes
      - /tmp/oraculo-comfyui/input:/root/ComfyUI/input
      - /tmp/oraculo-comfyui/output:/root/ComfyUI/output
      - ./comfyui/user:/root/ComfyUI/user
      - ./comfyui/user-scripts:/root/user-scripts
      - ./data/comfyui/hf-cache:/root/.cache/huggingface
      - ./data/comfyui/torch-cache:/root/.cache/torch

  # =========================================================
  # mcp-playwright — Playwright MCP como tool server do Open WebUI
  # =========================================================
  # O Open WebUI fala MCP apenas via Streamable HTTP, então o
  # @playwright/mcp roda aqui em modo HTTP (entrypoint da imagem já
  # traz --headless --browser chromium --no-sandbox).
  # MCP Streamable HTTP: http://localhost:8931/mcp
  # network_mode: host para que o navegador alcance os serviços locais
  # (8080/8081/8888); por isso o bind é 127.0.0.1, não 0.0.0.0.
  # =========================================================
  mcp-playwright:
    image: mcr.microsoft.com/playwright/mcp:v0.0.83
    container_name: mcp-playwright
    restart: unless-stopped
    network_mode: host
    command:
      - "--port"
      - "8931"
      - "--host"
      - "127.0.0.1"
    shm_size: "1073741824"

  # =========================================================
  # mcp-memory — server-memory (stdio) exposto via supergateway
  # =========================================================
  # @modelcontextprotocol/server-memory é stdio-only; o supergateway
  # faz a ponte stdio → Streamable HTTP para o Open WebUI.
  # MCP Streamable HTTP: http://localhost:8932/mcp
  # Compartilha o memory.json do opencode (mesmo grafo de conhecimento).
  # =========================================================
  mcp-memory:
    image: supercorp/supergateway:4.1.0
    container_name: mcp-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8932:8932"
    user: "1000:1000"
    environment:
      - MEMORY_FILE_PATH=/data/memory.json
      - npm_config_cache=/tmp/npm-cache
    command:
      - "--stdio"
      - "npx -y @modelcontextprotocol/server-memory"
      - "--outputTransport"
      - "streamableHttp"
      - "--stateful"
      - "--sessionTimeout"
      - "300000"
      - "--port"
      - "8932"
      - "--streamableHttpPath"
      - "/mcp"
    volumes:
      # diretório (não arquivo): o server-memory grava com rename atômico,
      # que falha (EBUSY) sobre bind mount de arquivo único
      - ./mcp-data:/data
      - ./mcp-data/npm-cache:/tmp/npm-cache

  # =========================================================
  # 9router — Proxy de roteamento para providers cloud de LLM
  # =========================================================
  # Fallback cloud opcional ao serving local (llama-swap): agrega 40+
  # providers (free tiers: OpenCode Free, Kiro; API-key: OpenRouter, Groq...)
  # atrás de um endpoint OpenAI-compatible único.
  # Dashboard: http://localhost:20128/dashboard | API: /v1
  # Segredos no .env (JWT_SECRET/INITIAL_PASSWORD/API_KEY_SECRET/MACHINE_ID_SALT).
  # Senha default `123456` se INITIAL_PASSWORD não for setada — sempre setar.
  # Conveniência, NÃO infraestrutura: listas de modelos free mudam sem aviso.
  # =========================================================
  9router:
    image: decolua/9router:0.5.95
    container_name: 9router
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - BASE_URL=http://localhost:20128
      - NEXT_PUBLIC_BASE_URL=http://localhost:20128
      - JWT_SECRET=${JWT_SECRET}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - MACHINE_ID_SALT=${MACHINE_ID_SALT}
      - ENABLE_REQUEST_LOGS=false
    volumes:
      - ./data/9router:/app/data

  # =========================================================
  # openwa-docker-proxy — Proxy seguro para Docker socket
  # =========================================================
  # Expõe apenas as operações necessárias (containers, images, volumes,
  # info, ping, post, delete). Tudo mais é negado por padrão.
  # Este container é o ÚNICO com acesso ao Docker socket.
  # =========================================================
  openwa-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: openwa-docker-proxy
    restart: unless-stopped
    networks:
      - openwa-network
      - openwa-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      INFO: 1
      PING: 1
      POST: 1
      DELETE: 1
      # Tudo mais é negado (AUTH, SECRETS, NETWORKS, PLUGINS, SWARM, etc.)

  # =========================================================
  # openwa — WhatsApp API Gateway com MCP habilitado
  # =========================================================
  # Exposto em http://localhost:2785
  # MCP Streamable HTTP: POST http://localhost:2785/mcp
  # Autenticação: header X-API-Key ou Authorization: Bearer <key>
  # A API key é gerada na primeira inicialização e salva em openwa-data/.api-key
  # =========================================================
  openwa:
    image: ghcr.io/rmyndharis/openwa:main
    container_name: openwa
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:2785:2785"
    networks:
      - openwa-network
      - openwa-internal
    environment:
      - NODE_ENV=production
      - PORT=2785
      - LOG_LEVEL=info
      - MCP_ENABLED=true
      - MCP_READONLY=false
      - AUTO_START_SESSIONS=false
      - API_PORT=2785
      - DOCKER_HOST=tcp://openwa-docker-proxy:2375
      - DATABASE_TYPE=sqlite
    volumes:
      - ./data/openwa:/app/data
      - ./data/openwa/sessions:/app/data/sessions
    depends_on:
      - openwa-docker-proxy

  # =========================================================
  # hermes — Hermes Agent (Nous Research) sob o porteiro hermes-gate
  # =========================================================
  # AGENTE AUTÔNOMO — fica FORA do `./manage.sh start` (profile
  # "hermes" não é default). Quem decide acordar é o bin/hermes-gate.sh
  # (systemd --user): só roda com a TELA BLOQUEADA e sem jogo ocupando
  # a GPU; stop imediato quando o humano volta. restart "no" de
  # propósito — nada revive o Hermes sem passagem pelo gate.
  # Modelo: llama-swap via localhost:8081 (config.yaml em data/hermes/,
  # provider custom). network_mode host pelo mesmo motivo dos demais
  # containers que falam com o proxy: o llama-swap escuta só em
  # 127.0.0.1 (gateway API do Hermes em 8642, loopback).
  # Setup único (wizard interativo):
  #   mkdir -p data/hermes
  #   docker compose --profile hermes run --rm hermes setup
  # Docs: DOCKER.md → "hermes — Hermes Agent (porteiro)".
  # =========================================================
  hermes:
    image: nousresearch/hermes-agent:v0.22.2
    container_name: hermes
    restart: no
    profiles: ["hermes"]
    command: gateway run
    network_mode: host
    environment:
      # remapeia o usuário do container p/ o host (dono do bind mount)
      - HERMES_UID=1000
      - HERMES_GID=1000
    stop_grace_period: 10s
    volumes:
      - ./data/hermes:/opt/data

networks:
  # Rede interna — apenas openwa e openwa-docker-proxy (sem acesso externo)
  openwa-internal:
    name: openwa-internal-docker
    internal: true

  # Rede externa — openwa e outros containers precisam se comunicar
  openwa-network:
    name: openwa-network

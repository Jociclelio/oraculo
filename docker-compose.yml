services:
  # =========================================================
  # llama-cpp — Servidor de inferência (llama.cpp)
  # =========================================================
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: llama-cpp
    privileged: true
    network_mode: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    restart: always
    volumes:
      - ./models:/models
      - ./models/models.ini:/app/models.ini
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["-s", "--verbosity", "3", "--models-preset", "/app/models.ini", "--models-max", "1", "--host", "0.0.0.0", "--port", "8081"]

  # =========================================================
  # open-webui — Interface web para LLMs
  # =========================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    network_mode: host
    restart: always
    environment:
      - OAI_API_BASE=http://localhost:8081/v1
      - WEBUI_SECRET_KEY=oraculo-secret-key
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - llama-cpp

volumes:
  open-webui-data:



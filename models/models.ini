[*]
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
parallel = 1
flash-attn = on
mlock = 1
jinja = 1
threads = 5
cache-ram = 2048
sleep-idle-seconds = 300

[Gemma4_12B]
model = /models/gemma-4-12B-it-qat-UD-Q4_K_XL/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-12B-it-qat-UD-Q4_K_XL/mmproj-F32.gguf
ctx-size = 49152
ngl = all
; temp = 1.0
; top-p = 0.95
; top-k = 64

; Gemma 4 12B IT com MTP speculative decoding -> ~100 tok/s em RTX 3060 12GB
; com o contexto completo de 262144, 100% na GPU, zero CPU offload.
; Truque de VRAM: split do KV cache -- q8_0 no target (herdado do global), f16 no draft.
; Quantizar o cache do draft quebra a taxa de acerto/aceitacao; f16 mantem ~70% de
; aceitacao a 262K. Equivale ao comando (llama-swap):
;   llama-server -m gemma-4-12B-it-qat-UD-Q4_K_XL.gguf --model-draft mtp-gemma-4-12B-it.gguf \
;     -ngld 99 --spec-type draft-mtp --spec-draft-n-max 4 -ngl 99 -c 262144 -fa on --jinja \
;     -np 1 -ctk q8_0 -ctv q8_0 -ctkd f16 -ctvd f16 -b 4096 -ub 1280 \
;     --temp 1.0 --top-p 0.95 --top-k 64 --repeat-penalty 1.0
[Gemma4_12B_MTP]
model = /models/gemma-4-12B-it-qat-UD-Q4_K_XL/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-12B-it-qat-UD-Q4_K_XL/mmproj-F32.gguf
model-draft = /models/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced/mtp-gemma-4-12B-it.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
; (ATENCAO) ctx=262144 (ideal do post X) falha OOM na RTX 3060 12GB porque Hyprland/
; Wayland ocupa ~880 MiB de VRAM; reduzido para o maximo validado nesta GPU+sw.
ctx-size = 128000
ngl = all
spec-draft-ngl = 99
cache-type-k-draft = f16
cache-type-v-draft = f16
batch-size = 4096
ubatch-size = 1280
temp = 1.0
top-p = 0.95
top-k = 64
repeat-penalty = 1.0
cache-ram = 0


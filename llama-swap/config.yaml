# llama-swap/config.yaml — proxy único em 127.0.0.1:8081
# =====================================================================
# Fonte dos parâmetros: models/models.ini (tradução INI -> flags do
# llama-server). O models.ini permanece no repo como referência, desativado
# (a remoção do serviço docker `llama-cpp` do compose é a task 006).
#
# Engine stock: imagem oficial ghcr.io/ggml-org/llama.cpp:full-cuda, um
# container Docker efêmero por modelo (`docker run --rm`), GPU inteira via
# `--gpus all`. Swap gerenciado pelo llama-swap: só 1 modelo carregado por
# vez (equivale ao `--models-max 1` do antigo serviço).
#
# Posicionamento do plano: stack para 1 usuário por vez. `np=1` default;
# `np>1` só como exceção pontual para modelos pequenos (exemplo comentado
# no fim deste arquivo).
#
# Convenções de tradução do INI:
#   ngl = all      -> -ngl 99  (todas as camadas na GPU)
#   sleep-idle-seconds = 300 -> ttl: 300 (campo YAML do llama-swap)
#   alias = <nome> -> campo `aliases` da entry do llama-swap
#
# Convenção de NOME/CONTEXTO (tuning 2026-10-15):
#   - Toda entry SEM sufixo de contexto roda em 128k (-c 131072) — floor,
#     viabilizado pelo KV quantizado (-ctk q5_1 -ctv q5_1, requer -fa on;
#     tipos K/V DIFERENTES são proibidos — ver regra 10).
#   - Modelo que não alcança 128k: sufixo _XXk com o maior contexto validado.
#   - VRAM validada por carga real (RTX 3060 12 GB, display idle ~900 MiB);
#     com jogos/desktop pesado (1,8+ GB) entries de MoE híbrido podem OOM.

# Espera máxima pelo healthcheck do modelo ao carregar. 300 s cobre o
# carregamento a frio dos GGUFs de 21 GB (MoE 35B) a partir do NVMe.
healthCheckTimeout: 300

macros:
  # Macro stock — comando Docker reutilizável por modelo.
  # - manage.sh inicia o llama-swap a partir da raiz do repo, então o mount
  #   relativo `./models` resolve para o mesmo diretório do antigo serviço.
  # - IMPORTANTE: o llama-swap NÃO executa o cmd via shell (tokeniza com
  #   shlex); nada de `;`, pipes ou redirecionamentos — um único comando.
  # - A imagem tem ENTRYPOINT /app/tools.sh (dispatcher que espera `-s`);
  #   sobrescrevemos com --entrypoint /app/llama-server para executar o
  #   binário do servidor diretamente com as flags de cada entry.
  # - Porta interna fixa 8080; ${PORT} (macro do llama-swap) publica só no
  #   loopback do host — o proxy padrão http://localhost:${PORT} roteia para cá.
  # - Flags globais herdadas da seção [*] do models.ini:
  #   cache-type-k/v = q5_1/q5_1 (tipo ÚNICO — ver regra 10) -> -ctk/-ctv; cache-reuse = 256 -> --cache-reuse;
  #   parallel = 1 -> -np 1; flash-attn = on -> -fa on; jinja = 1 -> --jinja;
  #   threads = 5 -> -t 5; cache-ram = 2048 -> --cache-ram.
  "docker-stock": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /app/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    ghcr.io/ggml-org/llama.cpp:full-cuda
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q5_1 -ctv q5_1
    --cache-reuse 256 --cache-ram 2048

  # Macro Bonsai/PrismML — mesma receita do docker-stock, mas com a imagem
  # local do fork (engines/llama.cpp-prismml/, commit pinado 84445367f).
  # REGRA DURA (ver /home/jocic/bonsai-llm/AGENTS.md): NUNCA usar a imagem
  # stock para GGUFs Bonsai 2 — stock recusa PTQ1_0/PQ2_0 ou carrega como
  # Q2_0 legacy gerando lixo. A imagem do fork herda o ENTRYPOINT
  # nvidia_entrypoint.sh da base nvidia/cuda (o Dockerfile não o sobrescreve),
  # então usamos --entrypoint /usr/local/bin/llama-server para executar o
  # servidor diretamente com as flags de cada entry.
  "docker-prismml": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    llama.cpp-prismml:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q5_1 -ctv q5_1
    --cache-reuse 256 --cache-ram 2048

  # Macro Xing4.0 — mesma receita do docker-prismml, mas com a imagem local
  # do fork shuxiaoqiong (engines/llama.cpp-xing/, commit pinado 8c379195a).
  # REGRA DURA: NUNCA usar a imagem stock para GGUFs Xing4.0 — o suporte à
  # arquitetura `xing4_0` (MoE 29B/4B + MLA + mHC) vive no PR ggml-org#29012,
  # ainda não mergeado; a stock recusa o GGUF. Mesmo padrão de entrypoint do
  # PrismML (base nvidia/cuda herda nvidia_entrypoint.sh).
  "docker-xing": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    llama.cpp-xing:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q5_1 -ctv q5_1
    --cache-reuse 256 --cache-ram 2048

  # Macro pdcache — mesma receita do docker-stock, mas com a imagem local
  # llama.cpp-pdcache (engines/llama.cpp-pdcache/: master ggml-org pinado no
  # MESMO commit da imagem stock + patch de prompt disk cache portado do fork
  # qqkzlm/llama-cpp-prompt-disk-cache). Resolve a regra 9: snapshots
  # COMPLETOS `.centry` (tokens + estado de sequência, com guard de
  # fingerprint do modelo + ctx + FA + tipos KV + build) escritos
  # atomicamente em disco quando o slot termina e restaurados automaticamente
  # no próximo request após o (re)start — sobrevive ao `docker rm -f` do
  # llama-swap (unload do gpu-shim, swap, ttl) sem nenhuma orquestração. O
  # bug ggml-org/llama.cpp#28194 (/slots sem checkpoints em híbridos/SWA) fica
  # contornado: este caminho não usa /slots.
  # - Cache em bind mount ./data/llama-pdcache (persistente, gitignored).
  #   O guard torna o diretório compartilhável entre entries/modelos —
  #   entradas incompatíveis são ignoradas com segurança.
  # - Budget 40 GiB (NVMe tinha 391 GiB livres em 2026-10-17).
  # - --checkpoint-min-step 2048: checkpoints em RAM a cada ~2k tokens de
  #   prompt (turno agêntico típico) — o default 8192 é grosso demais; são
  #   eles que vão para o snapshot em disco.
  # - --ctx-checkpoints 16: limita a RAM dos checkpoints em memória
  #   (os GGUFs MoE com --load-mode none já fixam ~22 GB de pesos na RAM;
  #   default 32 pode pressionar swap em prompts longos).
  # - Mesma base do stock: todos os modelos servidos com docker-stock são
  #   elegíveis a este macro (a base `prism` do fork original NÃO serve —
  #   prefill de MoE na CPU 20x mais lento, ver regra 9).
  "docker-pdcache": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    -v ./data/llama-pdcache:/kvcache
    llama.cpp-pdcache:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q5_1 -ctv q5_1
    --cache-reuse 256 --cache-ram 1024
    --sleep-idle-seconds 180
    --slot-save-path /kvcache
    --prompt-cache-disk-budget 40
    --checkpoint-min-step 2048
    --ctx-checkpoints 16

  # Stop do container: rm -f é determinístico e imediato (SIGKILL ao
  # processo do container -> VRAM liberada na hora; --rm remove o container).
  # Nota: se um crash do llama-swap deixar container órfão, o próximo
  # `docker run` falha por conflito de nome; limpar com `docker rm -f ls-<Modelo>`.
  "docker-stop": >
    docker rm -f ls-${MODEL_ID}

models:
  # ---------------------------------------------------------------------
  # Gemma 4 12B IT (QAT UD Q4_K_XL) — multimodal (texto)
  # ---------------------------------------------------------------------
  Gemma4_12B:
    cmd: |
      ${docker-pdcache}
      -m /models/gemma-4-12B-it-qat-UD-Q4_K_XL/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/gemma-4-12B-it-qat-UD-Q4_K_XL/mmproj-F32.gguf
      -c 131072 -ngl 99
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B-A3B Thinking General (Q4_K_M + head MTP embutido) — MoE
  # GGUF: variante -MTP (tensors nextn validados no header) — speculative
  # decoding self-draft via --spec-type draft-mtp (sem --model-draft).
  # ---------------------------------------------------------------------
  Qwen3.6_35B_General:
    cmd: |
      ${docker-pdcache}
      -m /models/unsloth_Qwen3.6_35B_A3B_MTP/Qwen3.6-35B-A3B-MTP-Q4_K_M.gguf
      --mmproj /models/unsloth_Qwen3.6_35B_A3B_MTP/mmproj-F16.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99 -ncmoe 33
      -b 4096 -ub 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B-A3B Thinking Code (Q4_K_M + head MTP) — temp 0.6, sem penalty
  # ---------------------------------------------------------------------
  Qwen3.6_35B_Code:
    cmd: |
      ${docker-pdcache}
      -m /models/unsloth_Qwen3.6_35B_A3B_MTP/Qwen3.6-35B-A3B-MTP-Q4_K_M.gguf
      --mmproj /models/unsloth_Qwen3.6_35B_A3B_MTP/mmproj-F16.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99 -ncmoe 31
      -b 4096 -ub 1024
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800
    # VALIDADA em 2026-10-18 (prompt 21k, qwen35moe/GDN): unload (docker rm -f)
    # + re-request → cache_n 21213/21217 (99,98%), prompt_n 4, prefill ~0,5 s
    # (era 33 s); snapshot .centry 638 MiB (escrita 730 ms, leitura 765 ms,
    # restore p/ GPU 48 ms). Rollout do macro para todas as entries stock no
    # mesmo dia — ver regra 9.

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B-A3B Instruct General (Q4_K_M + head MTP)
  # ---------------------------------------------------------------------
  Qwen3.6_35B_It_General:
    cmd: |
      ${docker-pdcache}
      -m /models/unsloth_Qwen3.6_35B_A3B_MTP/Qwen3.6-35B-A3B-MTP-Q4_K_M.gguf
      --mmproj /models/unsloth_Qwen3.6_35B_A3B_MTP/mmproj-F16.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99 -ncmoe 33
      -b 4096 -ub 2048
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B-A3B Instruct Reasoning (Q4_K_M + head MTP)
  # ---------------------------------------------------------------------
  Qwen3.6_35B_It_Reasoning:
    cmd: |
      ${docker-pdcache}
      -m /models/unsloth_Qwen3.6_35B_A3B_MTP/Qwen3.6-35B-A3B-MTP-Q4_K_M.gguf
      --mmproj /models/unsloth_Qwen3.6_35B_A3B_MTP/mmproj-F16.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99 -ncmoe 33
      -b 4096 -ub 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Ornith 1.5 35B-A3B MTP (APEX Compact, mudler) — acceptance ~0.80,
  # MoE (28 experts CPU)
  # ---------------------------------------------------------------------
  Ornith1.5_35B_MTP:
    cmd: |
      ${docker-pdcache}
      -m /models/Ornith-1.5-35B-MTP-APEX-Compact/Ornith-1.5-35B-A3B-APEX-MTP-Compact.gguf
      --mmproj /models/Ornith-1.5-35B-MTP-APEX-Compact/mmproj.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 1
      -c 131072 -ngl 99 -ncmoe 29
      -b 4096 -ub 2048
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Ornith 1.5 9B (ornith-ai) — variante edge DENSA da família (arch
  # qwen35, sem experts), raciocínio agêntico com <think/tool_call>.
  # Ctx nativo 262144. Head MTP embutida (nextn=1, validado no header) →
  # draft-mtp self-draft (regra 5), sem --model-draft.
  # Sampling do model card (general): temp 1.0 / top-p 0.95 / top-k 20 /
  # presence 1.5 (coding: temp 0.6 / presence 0.0).
  # ---------------------------------------------------------------------
  Ornith1.5_9B:
    cmd: |
      ${docker-pdcache}
      -m /models/Ornith-1.5-9B-Q4_K_M/Ornith-1.5-9B-Q4_K_M.gguf
      --mmproj /models/Ornith-1.5-9B-Q4_K_M/mmproj-Ornith-1.5-9B-BF16.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99
      -b 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.5 9B Uncensored HauhauCS-Aggressive — variante uncensored da
  # família Qwen3.5 9B (arch qwen35, DENSA, sem -ncmoe; no lugar da
  # Ornith1.5_9B_Uncensored, removida 2026-10-19). mmproj BF16 incluso
  # (visor da família). SEM MTP: header sem tensors/keys nextn (verificado
  # no GGUF — diferente do Ornith 9B da ornith-ai, que tinha head embutida).
  # ---------------------------------------------------------------------
  Qwen3.5_9B_HauhauCS:
    cmd: |
      ${docker-pdcache}
      -m /models/Qwen3.5-9B-Uncensored-HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      --mmproj /models/Qwen3.5-9B-Uncensored-HauhauCS/mmproj-Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-BF16.gguf
      -c 131072 -ngl 99
      -b 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # MiMo-V2.6 Distill Qwen 9B (XiaomiMiMo — distill do MiMo-V2.6 em base
  # Qwen3.5; arch qwen35, DENSA, sem -ncmoe). Multimodal (image-text-to-
  # text), ctx nativo 262144. GGUF bartowski Q4_K_M + mmproj f16 (o
  # oficial ggml-org só publica Q8_0 9,5 GB — não cabe com o floor 128k).
  # SEM MTP: header sem tensors nextn (verificado; diferente do Ornith 9B).
  # Sampling do generation_config oficial: temp 0.6 / top-p 0.95 / top-k 20.
  # ---------------------------------------------------------------------
  MiMo2.6_9B:
    cmd: |
      ${docker-pdcache}
      -m /models/MiMo-V2.6-Distill-Qwen-9B-GGUF/MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
      --mmproj /models/MiMo-V2.6-Distill-Qwen-9B-GGUF/mmproj-MiMo-V2.6-Distill-Qwen-9B-f16.gguf
      -c 131072 -ngl 99
      -b 4096
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # NVIDIA Nemotron 3.5 Bolt 74B-A9B (24GB, IQ2-XXS QAD) — MoE híbrido
  # Mamba-2 + LatentMoE (arch nemotron_h_moe: 88 blocos = 8 attention
  # [KV heads 2] + 40 SSM + 40 MoE [496 experts totais, 9 ativos]).
  # VLM: mmproj C-RADIO v4-H (1,7 GB). Ctx nativo 262144.
  # Requer llama.cpp >= PR ggml-org#30520 (merge 2026-10-15) — imagem
  # stock atualizada p/ build 11681 (0.7.0-dev 5e03a1ff).
  # Experts IQ2: 431 MiB/camada; -ncmoe 32 deixa ~7 GiB de pesos na GPU.
  # MoE híbrido: --load-mode none (regra 2). DFlash drafter LiLiCorr
  # (1 GB, draft separado → -ctkd/-ctvd f16, regra 5).
  # Sampling do model card: temp 1.0 / top-p 0.95.
  # ---------------------------------------------------------------------
  Nemotron3.5_Bolt_74B:
    cmd: |
      ${docker-pdcache}
      -m /models/Nemotron3.5-Bolt-74B-A9B-24GB/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
      --mmproj /models/Nemotron3.5-Bolt-74B-A9B-24GB/mmproj-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
      --model-draft /models/Nemotron3.5-Bolt-74B-A9B-24GB/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr.gguf
      --spec-type draft-dflash --spec-draft-n-max 6
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 32
      -ngld 99 -ctkd f16 -ctvd f16
      -b 4096 -ub 2048
      --temp 1.0 --top-p 0.95
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B Uncensored Aggressive (HauhauCS) — multimodal,
  # MoE (28 camadas na CPU). Otimizado 2026-10-14 p/ teto de 10 GB:
  # -ncmoe 28 (era 32): prefill 9730 tok ~1060->~1150 tok/s (+9%);
  # decode ~39 tok/s (CPU-bound, sem ganho mensurável dentro do teto).
  # VRAM processo ~9770-9830 MiB (< 10 GiB); total c/ desktop ~10,5 GB.
  # SEM spec decoding: o GGUF não contém tensors nextn/MTP (verificado no
  # header) — --spec-type draft-mtp inaplicável; draft externo descartado
  # (precedente DSpark: aceitação ~10%, mais lento). --moe-cache-mib
  # testado (1024 MiB): decode 38,7->30,5 tok/s — rejeitado. -t 6 e -tb 6
  # testados: sem ganho/piora — mantido -t 5 do macro.
  # ---------------------------------------------------------------------
  Qwen3.6_35B_A3B_Hauhau_Aggressive:
    cmd: |
      ${docker-pdcache}
      -m /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      --mmproj /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 29
      -b 4096 -ub 2048
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Bonsai 2 27B (PrismML fork) — GGUF ternário PTQ1_0 (PQ2_0 removida em
  # 2026-10-13; mantida a quantização menor), movidos de
  # /home/jocic/bonsai-llm (task 004). Engine: imagem local
  # llama.cpp-prismml:latest (commit pinado 84445367f) — NUNCA stock.
  # Sem temp/top-p/top-k: os defaults de sampling (thinking: temp 1.0,
  # top_p 0.95, top_k 20) vivem nos metadados do GGUF.
  # Sem MTP (não baixado — fora de escopo).
  # ---------------------------------------------------------------------

  # Entry primária — PTQ1_0 (~5,6 GB) + mmproj (visão).
  # ctx 131072 validado na RTX 3060 12GB (2026-10-15, KV q5_1/iq4_nl):
  # carga OK, VRAM total observada 10162 MiB / 12288 (inclui ~890 MiB do
  # display Hyprland/Wayland; mmproj carregado). Sem OOM; denso, sem
  # alavanca de -ncmoe — se a VRAM do display crescer, fallback de ctx.
  bonsai-27b:
    cmd: |
      ${docker-prismml}
      -m /models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PTQ1_0.gguf
      --mmproj /models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
      -c 131072 -ngl 99
    cmdStop: ${docker-stop}
    ttl: 300

  # ---------------------------------------------------------------------
  # Bonsai 2 27B Uncensored "Heretic" (OS-Software) — finetune uncensored
  # do Bonsai 2 acima, MESMA engine PrismML pinada (regra dura: PTQ1_0 só
  # roda no fork — a stock/pdcache recusa o formato ternário). Sampling
  # vive nos metadados do GGUF (como o irmão). SEM pdcache/sleep: o patch
  # de KV em disco foi portado para o master ggml-org apenas (a base
  # prism não o tem) — unload/re-ttl = re-prefill nesta entry.
  # ---------------------------------------------------------------------
  bonsai-27b-heretic:
    cmd: |
      ${docker-prismml}
      -m /models/Ternary-Bonsai-2-27B-Heretic/Ternary-Bonsai-2-27B-Uncensored-Heretic-PTQ1_0.gguf
      --mmproj /models/Ternary-Bonsai-2-27B-Heretic/mmproj-Q8_0.gguf
      -c 131072 -ngl 99
    cmdStop: ${docker-stop}
    ttl: 300

  # ---------------------------------------------------------------------
  # Bonsai 2 9B (variante edge da família, denso — instalado 2026-10-20,
  # origem prism-ml/Ternary-Bonsai-2-9B-gguf). MESMA engine PrismML pinada
  # (regra dura: PTQ1_0 só roda no fork — a stock/pdcache recusa o formato
  # ternário). Sampling vive nos metadados do GGUF. SEM MTP/DFlash (drafts
  # DFlash2-Q8_0 e PQ2_0-MTP-Q8_0 existem no repo HF, não baixados).
  # ---------------------------------------------------------------------
  bonsai-9b:
    cmd: |
      ${docker-prismml}
      -m /models/Ternary-Bonsai-2-9B-gguf/Ternary-Bonsai-2-9B-PTQ1_0.gguf
      --mmproj /models/Ternary-Bonsai-2-9B-gguf/Ternary-Bonsai-2-9B-mmproj-Q8_0.gguf
      -c 131072 -ngl 99
    cmdStop: ${docker-stop}
    ttl: 300

  # ---------------------------------------------------------------------
  # Bonsai 2 9B Uncensored (AtomicChat) — LoRA rank-1 de 3,2 MB que remove
  # a direção de recusa NO GRAFO de computo (base PTQ1_0 byte-idêntico,
  # nada re-quantizado). Mesma engine PrismML pinada do irmão (o stock nem
  # abre o pack ternário). --lora-scaled 1: recusas 100% → 0% (custo ~4,3
  # MMLU; scale 0 desligaria o adapter no mesmo processo). MESMAS
  # limitações de contexto do bonsai-9b (prefill/decode degradam — usar
  # < 4k tokens). LoRA medido pelo autor no fork prism-b10777; aqui roda
  # no pin 84445367f (validado em carga 2026-10-20).
  # ---------------------------------------------------------------------
  bonsai-9b-uncensored:
    cmd: |
      ${docker-prismml}
      -m /models/Ternary-Bonsai-2-9B-gguf/Ternary-Bonsai-2-9B-PTQ1_0.gguf
      --mmproj /models/Ternary-Bonsai-2-9B-gguf/Ternary-Bonsai-2-9B-mmproj-Q8_0.gguf
      --lora-scaled /models/Ternary-Bonsai-2-9B-Uncensored-LoRA/Ternary-Bonsai-2-9B-Uncensored-LoRA.gguf:1
      -c 131072 -ngl 99
    cmdStop: ${docker-stop}
    ttl: 300

  # ---------------------------------------------------------------------
  # Strata REMOVIDA em 2026-10-14 (pesos 86G apagados do disco na limpeza
  # do NVMe). A imagem da engine (strata:latest) e a infra de build
  # (engines/strata/) ficam — reativável seguindo engines/strata/README.md
  # (os pesos são re-gerados a partir dos GGUFs originais do HF).
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # LFM 2.5 24B-A2B (LiquidAI, Q4_K_M) — raciocínio puro (sempre pensa),
  # MoE 24B/2,45B ativo (64 experts top-4, 40 camadas = 30 conv + 10 GQA),
  # vocab 128k, ctx nativo 131072. Agêntico (post-train em OpenClaw/Hermes/
  # Pi/OpenCode). Arquitetura `lfm2moe` no llama.cpp upstream.
  # - Q4_K_M 14,5 GB não cabe inteiro na VRAM: --load-mode none + -ncmoe
  #   (regra 2 — com mmap o decode desaba silenciosamente).
  # - Sampling do README oficial: temp 0.1 / top_k 50 / repeat-penalty 1.05.
  # - Sem MTP embutido (família LFM2.5 usa draft DSpark separado, ainda não
  #   publicado para este modelo).
  # ---------------------------------------------------------------------
  LFM2.5_24B_A2B:
    cmd: |
      ${docker-pdcache}
      -m /models/LFM2.5-24B-A2B-GGUF/LFM2.5-24B-A2B-Q4_K_M.gguf
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 20
      -b 4096 -ub 2048
      --temp 0.1 --top-k 50 --repeat-penalty 1.05
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # LFM 2.5 24B-A2B IQ2_M (unsloth UD) — a MESMA entry acima em 100% GPU:
  # IQ2_M (7,5 GB) cabe inteiro na VRAM, sem --load-mode none e sem
  # -ncmoe (regra 2 não se aplica — não há experts na CPU). Sem MTP
  # (DSpark não publicado). Sampling do README oficial: temp 0.1 / top-k
  # 50 / repeat-penalty 1.05.
  # ---------------------------------------------------------------------
  LFM2.5_24B_A2B_IQ2_M:
    cmd: |
      ${docker-pdcache}
      -m /models/LFM2.5-24B-A2B-IQ2_M/LFM2.5-24B-A2B-UD-IQ2_M.gguf
      -c 131072 -ngl 99
      -b 4096 -ub 2048
      --temp 0.1 --top-k 50 --repeat-penalty 1.05
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Xing4.0 29B-A4B (Venastine-Research, Q4_K_M) — engine dedicada
  # llama.cpp-xing (fork shuxiaoqiong, PR ggml-org#29012 — NUNCA stock).
  # Arquitetura: MoE 29B/4B ativo (64 experts roteados + 1 shared, 40
  # camadas), MLA (kv_lora 512), mHC hyper-connections, MTP head; contexto
  # nativo 256K.
  # - --load-mode none é OBRIGATÓRIO: com mmap + overrides de tensor p/ CPU
  #   (-ncmoe), o loader avisa e o desempenho desaba (1,2 tok/s medido);
  #   sem mmap: 12,7 tok/s (validado 2026-10-10).
  # - MoE: -ncmoe 27/64 experts na CPU (128k + KV q5_1 validado 2026-10-15).
  # - Sampling do README oficial: temp 1.0 / top_p 0.95 / repeat-penalty 1.05.
  # - MTP draft: arquivo Q4_K_M-MTP não existe no repo (só IQ3) — sem spec
  #   decoding; tensors nextn do GGUF são ignorados pelo loader.
  # - Modelo thinking: resposta vem em reasoning_content + content.
  # ---------------------------------------------------------------------
  # - KV: o fork Xing NÃO aceita K/V com tipos diferentes (MLA: "model does
  #   not support different K and V cache types") — mesmo corte do stock
  #   (ver regra 10: tipo único q5_1/q5_1 nos macros serve aqui também).
  #   Validado 128k: ncmoe 27 → 10689 MiB total; ncmoe 25 → 11501 (apertado).
  Xing4.0_29B_A4B:
    cmd: |
      ${docker-xing}
      -m /models/Xing4.0-29B-A4B-Q4_K_M/Xing4.0-29B-A4B-Q4_K_M.gguf
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 27
      -b 4096 -ub 1024
      --temp 1.0 --top-p 0.95 --repeat-penalty 1.05
    cmdStop: ${docker-stop}
    ttl: 300

  # ---------------------------------------------------------------------
  # MiniCPM-V 4.7 35B-A3B (OpenBMB) — primeiro MoE multimodal da série
  # MiniCPM-V; backbone Qwen3.6-35B-A3B (arch qwen35moe: 41 camadas, 256
  # experts, 8 ativos, GDN + full attention a cada 4; ctx nativo 262144) +
  # visor SigLIP2 (LLaVA-UHD v4, compressão de tokens 4x/16x). GGUF oficial
  # em openbmb/MiniCPM-V-4.7-35B-A3B-gguf (Q4_K_M 21,2 GB + mmproj f16).
  # SEM MTP: o GGUF declara nextn_predict_layers=1 mas não contém tensors
  # nextn (verificado no header). Speculação via draft DSpark foi testada e
  # DESCARTADA (medido 2026-10-12): aceitação ~10% e decode 9,5 tok/s
  # (vs 32-35 sem draft) — o compute buffer do draft (~3,9 GB, logits
  # 248k vocab × ubatch) também não cabe na VRAM junto do target. O GGUF
  # do draft (413 MB) ficou em models/MiniCPM-V-4.7-35B-A3B-DSpark/ para
  # reteste futuro (conversão: convert_hf_to_gguf.py --target-model-dir
  # <dir com config/tokenizer do target>).
  # Requer llama.cpp >= PR #29416 (merge 2026-10-10): visor minicpmv4_7 +
  # rope.section_order zyxt — imagem stock atualizada p/ build 11561
  # (0.6.0-dev e937b17a). MoE híbrido: --load-mode none + -ncmoe (regra 2)
  # + -ub 2048 (regra 7). Sampling do model card: temp 1.0 / top-p 0.95 /
  # top-k 20. Medido (RTX 3060 12GB, display idle): decode ~32-35 tok/s,
  # prefill ~1040 tok/s, VRAM ~9,0 GB (ncmoe 32); visão validada.
  # ---------------------------------------------------------------------
  MiniCPM-V_4.7_35B:
    cmd: |
      ${docker-pdcache}
      -m /models/MiniCPM-V-4.7-35B-A3B-Q4_K_M/MiniCPM-V-4_7-35B-A3B-Q4_K_M.gguf
      --mmproj /models/MiniCPM-V-4.7-35B-A3B-Q4_K_M/mmproj-model-f16.gguf
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 32
      -b 4096 -ub 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # MiniCPM-V 4.7 1B (OpenBMB) — variante edge da série, DENSA (arch
  # qwen35, sem experts → sem -ncmoe/--load-mode none), ctx nativo 262144.
  # Mesmo visor LLaVA-UHD v4 da 35B (mesma imagem stock build 11561).
  # DSpark draft disponível no repo (dspark-MiniCPM-V-4_7-1B-F16.gguf) mas
  # NÃO instalado — precedente da 35B: aceitação ~10%.
  # ---------------------------------------------------------------------
  MiniCPM-V_4.7_1B:
    cmd: |
      ${docker-pdcache}
      -m /models/MiniCPM-V-4.7-1B-Q4_K_M/MiniCPM-V-4_7-1B-Q4_K_M.gguf
      --mmproj /models/MiniCPM-V-4.7-1B-Q4_K_M/mmproj-model-f16.gguf
      -c 131072 -ngl 99
      -b 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800


  # Variantes de contexto longo (_96k/_128k) REMOVIDAS em 2026-10-15: o floor
  # subiu para 128k em todas as entries base (KV quantizado q5_1/iq4_nl),
  # tornando as variantes redundantes. Se algum modelo não couber em 128k,
  # recriar a variante _XXk com o maior contexto validado (convenção no topo).
  # =====================================================================
  # Exemplo comentado — paralelismo np=2 (APENAS referência).
  # Posicionamento do plano é single-user; np>1 deve ser exceção pontual
  # para modelos pequenos. A flag repetida após o macro vence (-np 2 sobrescreve
  # o -np 1 do macro). Também é preciso dobrar o KV cache disponível (-c maior
  # por slot exige mais VRAM).
  #
  # ExemploModelo:
  #   cmd: |
  #     ${docker-stock}
  #     -np 2
  #     -m /models/exemplo/exemplo.gguf -c 32768 -ngl 99
  #   cmdStop: ${docker-stop}
  #   ttl: 300
  # =====================================================================

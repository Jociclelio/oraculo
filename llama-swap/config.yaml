  # Variantes de contexto longo (_96k/_128k) REMOVIDAS em 2026-10-15: o floor
  # subiu para 128k em todas as entries base (KV quantizado q5_1/iq4_nl),
  # tornando as variantes redundantes. Se algum modelo não couber em 128k,
  # recriar a variante _XXk com o maior contexto validado (convenção no topo).
  # =====================================================================
  # Exemplo comentado — paralelismo np=2 (APENAS referência).
  # Posicionamento do plano é single-user; np>1 deve ser exceção pontual
  # para modelos pequenos. A flag repetida após o macro vence (-np 2 sobrescreve
  # o -np 1 do macro). Também é preciso dobrar o KV cache disponível (-c maior
  # por slot exige mais VRAM).
  #
  # ExemploModelo:
  #   cmd: |
  #     ${docker-stock}
  #     -np 2
  #     -m /models/exemplo/exemplo.gguf -c 32768 -ngl 99
  #   cmdStop: ${docker-stop}
  #   ttl: 300
  # =====================================================================

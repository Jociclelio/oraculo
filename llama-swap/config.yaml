# llama-swap/config.yaml — proxy único em 127.0.0.1:8081
# =====================================================================
# Fonte dos parâmetros: models/models.ini (tradução INI -> flags do
# llama-server). O models.ini permanece no repo como referência, desativado
# (a remoção do serviço docker `llama-cpp` do compose é a task 006).
#
# Engine stock: imagem oficial ghcr.io/ggml-org/llama.cpp:full-cuda, um
# container Docker efêmero por modelo (`docker run --rm`), GPU inteira via
# `--gpus all`. Swap gerenciado pelo llama-swap: só 1 modelo carregado por
# vez (equivale ao `--models-max 1` do antigo serviço).
#
# Posicionamento do plano: stack para 1 usuário por vez. `np=1` default;
# `np>1` só como exceção pontual para modelos pequenos (exemplo comentado
# no fim deste arquivo).
#
# Convenções de tradução do INI:
#   ngl = all      -> -ngl 99  (todas as camadas na GPU)
#   sleep-idle-seconds = 300 -> ttl: 300 (campo YAML do llama-swap)
#   alias = <nome> -> campo `aliases` da entry do llama-swap
#
# Convenção de NOME/CONTEXTO (tuning 2026-10-15; política 2026-10-26):
#   - Toda entry SEM sufixo de contexto roda em 128k (-c 131072) — floor,
#     viabilizado pelo KV quantizado (-ctk q4_0 -ctv q4_0 desde 2026-10-27,
#     requer -fa on; tipos K/V DIFERENTES são proibidos — ver regra 10).
#   - Modelo que não alcança 128k é REMOVIDO do zoo (antes: sufixo _XXk;
#     precedente: K2-Horizon 40k, removido 2026-10-26).
#   - VRAM validada por carga real (RTX 3060 12 GB, display idle ~900 MiB);
#     com jogos/desktop pesado (1,8+ GB) entries de MoE híbrido podem OOM.

# Espera máxima pelo healthcheck do modelo ao carregar. 300 s cobre o
# carregamento a frio dos GGUFs de 21 GB (MoE 35B) a partir do NVMe.
healthCheckTimeout: 300

macros:
  # Macro stock — comando Docker reutilizável por modelo.
  # - manage.sh inicia o llama-swap a partir da raiz do repo, então o mount
  #   relativo `./models` resolve para o mesmo diretório do antigo serviço.
  # - IMPORTANTE: o llama-swap NÃO executa o cmd via shell (tokeniza com
  #   shlex); nada de `;`, pipes ou redirecionamentos — um único comando.
  # - A imagem tem ENTRYPOINT /app/tools.sh (dispatcher que espera `-s`);
  #   sobrescrevemos com --entrypoint /app/llama-server para executar o
  #   binário do servidor diretamente com as flags de cada entry.
  # - Porta interna fixa 8080; ${PORT} (macro do llama-swap) publica só no
  #   loopback do host — o proxy padrão http://localhost:${PORT} roteia para cá.
  # - Flags globais herdadas da seção [*] do models.ini:
  #   cache-type-k/v = q4_0/q4_0 (tipo ÚNICO — ver regra 10; default q4_0
#   desde 2026-10-27 — kernel FA rápido + menor VRAM; q5_1 era lento)
#   -> -ctk/-ctv; cache-reuse = 256 -> --cache-reuse;
  #   parallel = 1 -> -np 1; flash-attn = on -> -fa on; jinja = 1 -> --jinja;
  #   threads = 5 -> -t 5; cache-ram = 2048 -> --cache-ram.
  "docker-stock": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /app/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    ghcr.io/ggml-org/llama.cpp:full-cuda
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q4_0 -ctv q4_0
    --cache-reuse 256 --cache-ram 2048

  # Macro Bonsai/PrismML — mesma receita do docker-stock, mas com a imagem
  # local do fork (engines/llama.cpp-prismml/, commit pinado 84445367f).
  # REGRA DURA (ver /home/jocic/bonsai-llm/AGENTS.md): NUNCA usar a imagem
  # stock para GGUFs Bonsai 2 — stock recusa PTQ1_0/PQ2_0 ou carrega como
  # Q2_0 legacy gerando lixo. A imagem do fork herda o ENTRYPOINT
  # nvidia_entrypoint.sh da base nvidia/cuda (o Dockerfile não o sobrescreve),
  # então usamos --entrypoint /usr/local/bin/llama-server para executar o
  # servidor diretamente com as flags de cada entry.
  "docker-prismml": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    llama.cpp-prismml:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q4_0 -ctv q4_0
    --cache-reuse 256 --cache-ram 2048

  # ATENÇÃO (2026-10-27): o default dos macros É q4_0/q4_0 — a bateria e2e
  # de 24 entries (results/ctxsweep/) mostrou que o KV q5_1 NÃO tem kernel
  # FA dedicado (só f16/bf16/q4_0/q8_0) e cai no caminho genérico lento:
  # decode @130k 2,3x menor que q8_0 no MiniCPM 1B, 2,26x no MiMo, 1,27x na
  # Gemma e 1,19x no Qwen3.6 — e +9-18% de desvantagem até em ctx 0.
  # q4_0 ≈ q8_0 em velocidade com o MENOR footprint de KV (0,53x do q8_0,
  # 0,73x do q5_1) — mantém o floor 128k com folga. O fork PrismML tem o
  # mesmo problema no q5_1 (issue PrismML #191); entries bonsai: q4_0 nos
  # 27B (desde 2026-10-20), f16 nos 9B (medido — teto de performance lá).

  # Macro bonsai-ada — imagem local llama.cpp-bonsai-ada
  # (engines/llama.cpp-bonsai-ada/: fork llama.cpp-ada-ternary branch
  # `bonsai-q8-product`, commit pinado 2cadbfb6 = PrismML adfffbe + a pilha
  # de 71 patches do projeto bonsai-ada-surgery). Supersetch da prismml:
  # KV tiered (--kv-vram-cells), FA lê q4_0/q8_0/q3_0 K/V IN PLACE (patch
  # 0009 — resolve a limitação da issue PrismML #191 no caminho quantizado),
  # MTP self-draft + lookup drafting, packed KQ mask, harness-proofing.
  # Env vars do launcher original (start-server.ps1) que a receita 12 GB
  # seta: BATCH_INVARIANT (aritmética do mat-vec PTQ1_0 independente do
  # batch), SHARED_POOL + MTP_DRAFT_UBATCH (um pool CUDA p/ target+draft),
  # KQ_MASK_PACKED (máscara 1-bit, 1/16 da f16), CHECKPOINT_EVERY_NT e o
  # reasoning_effort default via chat-template-kwargs.
  "docker-bonsai-ada": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    -e GGML_CUDA_BATCH_INVARIANT=1
    -e GGML_CUDA_SHARED_POOL=1
    -e LLAMA_MTP_DRAFT_UBATCH=256
    -e LLAMA_ARG_KQ_MASK_PACKED=1
    -e LLAMA_ARG_CHECKPOINT_EVERY_NT=8192
    -e 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"reasoning_effort":"medium"}'
    llama.cpp-bonsai-ada:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    --cache-reuse 256 --cache-ram 4096

  # Macro Xing4.0 — mesma receita do docker-prismml, mas com a imagem local
  # do fork shuxiaoqiong (engines/llama.cpp-xing/, commit pinado 8c379195a).
  # REGRA DURA: NUNCA usar a imagem stock para GGUFs Xing4.0 — o suporte à
  # arquitetura `xing4_0` (MoE 29B/4B + MLA + mHC) vive no PR ggml-org#29012,
  # ainda não mergeado; a stock recusa o GGUF. Mesmo padrão de entrypoint do
  # PrismML (base nvidia/cuda herda nvidia_entrypoint.sh).
  "docker-xing": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    llama.cpp-xing:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q4_0 -ctv q4_0
    --cache-reuse 256 --cache-ram 2048

  # Macro pdcache — mesma receita do docker-stock, mas com a imagem local
  # llama.cpp-pdcache (engines/llama.cpp-pdcache/: master ggml-org pinado no
  # MESMO commit da imagem stock + patch de prompt disk cache portado do fork
  # qqkzlm/llama-cpp-prompt-disk-cache). Resolve a regra 9: snapshots
  # COMPLETOS `.centry` (tokens + estado de sequência, com guard de
  # fingerprint do modelo + ctx + FA + tipos KV + build) escritos
  # atomicamente em disco quando o slot termina e restaurados automaticamente
  # no próximo request após o (re)start — sobrevive ao `docker rm -f` do
  # llama-swap (unload do gpu-shim, swap, ttl) sem nenhuma orquestração. O
  # bug ggml-org/llama.cpp#28194 (/slots sem checkpoints em híbridos/SWA) fica
  # contornado: este caminho não usa /slots.
  # - Cache em bind mount ./data/llama-pdcache (persistente, gitignored).
  #   O guard torna o diretório compartilhável entre entries/modelos —
  #   entradas incompatíveis são ignoradas com segurança.
  # - Budget 12 GiB (reduzido de 40 GiB em 2026-10-26 — o cache havia
  #   crescido até o teto antigo num NVMe agora com ~98 GiB livres; o
  #   eviction no teto é LRU e os snapshots são reconstruídos on-demand).
  #   NÃO mover para /tmp: tmpfs de 16 GB em RAM — competiria com os ~22 GB
  #   de pesos fixados (--load-mode none) e sumiria no reboot.
  # - --checkpoint-min-step 2048: checkpoints em RAM a cada ~2k tokens de
  #   prompt (turno agêntico típico) — o default 8192 é grosso demais; são
  #   eles que vão para o snapshot em disco.
  # - --ctx-checkpoints 16: limita a RAM dos checkpoints em memória
  #   (os GGUFs MoE com --load-mode none já fixam ~22 GB de pesos na RAM;
  #   default 32 pode pressionar swap em prompts longos).
  # - Mesma base do stock: todos os modelos servidos com docker-stock são
  #   elegíveis a este macro (a base `prism` do fork original NÃO serve —
  #   prefill de MoE na CPU 20x mais lento, ver regra 9).
  "docker-pdcache": >
    docker run --rm --name ls-${MODEL_ID} --gpus all
    --entrypoint /usr/local/bin/llama-server
    -p 127.0.0.1:${PORT}:8080
    -v ./models:/models
    -v ./data/llama-pdcache:/kvcache
    llama.cpp-pdcache:latest
    --host 0.0.0.0 --port 8080
    -fa on --jinja -np 1 -t 5
    -ctk q4_0 -ctv q4_0
    --cache-reuse 256 --cache-ram 1024
    --sleep-idle-seconds 180
    --slot-save-path /kvcache
    --prompt-cache-disk-budget 12
    --checkpoint-min-step 2048
    --ctx-checkpoints 16

  # Stop do container: rm -f é determinístico e imediato (SIGKILL ao
  # processo do container -> VRAM liberada na hora; --rm remove o container).
  # Nota: se um crash do llama-swap deixar container órfão, o próximo
  # `docker run` falha por conflito de nome; limpar com `docker rm -f ls-<Modelo>`.
  "docker-stop": >
    docker rm -f ls-${MODEL_ID}

models:
  # ---------------------------------------------------------------------
  # Gemma 4 12B IT (QAT UD Q4_K_XL) — multimodal (texto)
  # ---------------------------------------------------------------------
  Gemma4_12B:
    cmd: |
      ${docker-pdcache}
      -m /models/gemma-4-12B-it-qat-UD-Q4_K_XL/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/gemma-4-12B-it-qat-UD-Q4_K_XL/mmproj-F32.gguf
      -c 131072 -ngl 99
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B-A3B Thinking (Q4_K_M + head MTP embutido) — MoE
  # GGUF: variante -MTP (tensors nextn validados no header) — speculative
  # decoding self-draft via --spec-type draft-mtp (sem --model-draft).
  # Única entry do Qwen3.6 desde 2026-10-26 (General assumiu o zoo;
  # Code/It_* removidas — variante MTP única cobre os casos; uncensored
  # continua na entry Hauhau_Aggressive).
  # ---------------------------------------------------------------------
  Qwen3.6_35B_A3B:
    cmd: |
      ${docker-pdcache}
      -m /models/unsloth_Qwen3.6_35B_A3B_MTP/Qwen3.6-35B-A3B-MTP-Q4_K_M.gguf
      --mmproj /models/unsloth_Qwen3.6_35B_A3B_MTP/mmproj-F16.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99 -ncmoe 33
      -b 4096 -ub 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800
    # VALIDADA em 2026-10-18 (prompt 21k, qwen35moe/GDN, como Qwen3.6_35B_Code):
    # unload (docker rm -f) + re-request → cache_n 21213/21217 (99,98%),
    # prompt_n 4, prefill ~0,5 s (era 33 s); snapshot .centry 638 MiB.
    # Rollout do macro para todas as entries stock no mesmo dia — ver regra 9.

  # ---------------------------------------------------------------------
  # Ornith 1.5 35B-A3B MTP (APEX Compact, mudler) — acceptance ~0.80,
  # MoE (28 experts CPU)
  # ---------------------------------------------------------------------
  Ornith1.5_35B_MTP:
    cmd: |
      ${docker-pdcache}
      -m /models/Ornith-1.5-35B-MTP-APEX-Compact/Ornith-1.5-35B-A3B-APEX-MTP-Compact.gguf
      --mmproj /models/Ornith-1.5-35B-MTP-APEX-Compact/mmproj.gguf
      --load-mode none
      --spec-type draft-mtp --spec-draft-n-max 1
      -c 131072 -ngl 99 -ncmoe 29
      -b 4096 -ub 2048
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Ornith 1.5 9B (ornith-ai) — variante edge DENSA da família (arch
  # qwen35, sem experts), raciocínio agêntico com <think/tool_call>.
  # Ctx nativo 262144. Head MTP embutida (nextn=1, validado no header) →
  # draft-mtp self-draft (regra 5), sem --model-draft.
  # Sampling do model card (general): temp 1.0 / top-p 0.95 / top-k 20 /
  # presence 1.5 (coding: temp 0.6 / presence 0.0).
  # ---------------------------------------------------------------------
  Ornith1.5_9B:
    cmd: |
      ${docker-pdcache}
      -m /models/Ornith-1.5-9B-Q4_K_M/Ornith-1.5-9B-Q4_K_M.gguf
      --mmproj /models/Ornith-1.5-9B-Q4_K_M/mmproj-Ornith-1.5-9B-BF16.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      -c 131072 -ngl 99
      -b 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.5 9B Uncensored HauhauCS-Aggressive — variante uncensored da
  # família Qwen3.5 9B (arch qwen35, DENSA, sem -ncmoe; no lugar da
  # Ornith1.5_9B_Uncensored, removida 2026-10-19). mmproj BF16 incluso
  # (visor da família). SEM MTP: header sem tensors/keys nextn (verificado
  # no GGUF — diferente do Ornith 9B da ornith-ai, que tinha head embutida).
  # ---------------------------------------------------------------------
  Qwen3.5_9B_HauhauCS:
    cmd: |
      ${docker-pdcache}
      -m /models/Qwen3.5-9B-Uncensored-HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      --mmproj /models/Qwen3.5-9B-Uncensored-HauhauCS/mmproj-Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-BF16.gguf
      -c 131072 -ngl 99
      -b 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # MiMo-V2.6 Distill Qwen 9B (XiaomiMiMo — distill do MiMo-V2.6 em base
  # Qwen3.5; arch qwen35, DENSA, sem -ncmoe). Multimodal (image-text-to-
  # text), ctx nativo 262144. GGUF bartowski Q4_K_M + mmproj f16 (o
  # oficial ggml-org só publica Q8_0 9,5 GB — não cabe com o floor 128k).
  # SEM MTP: header sem tensors nextn (verificado; diferente do Ornith 9B).
  # Sampling do generation_config oficial: temp 0.6 / top-p 0.95 / top-k 20.
  # ---------------------------------------------------------------------
  MiMo2.6_9B:
    cmd: |
      ${docker-pdcache}
      -m /models/MiMo-V2.6-Distill-Qwen-9B-GGUF/MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
      --mmproj /models/MiMo-V2.6-Distill-Qwen-9B-GGUF/mmproj-MiMo-V2.6-Distill-Qwen-9B-f16.gguf
      -c 131072 -ngl 99
      -b 4096
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # NVIDIA Nemotron 3.5 Bolt 74B-A9B (24GB, IQ2-XXS QAD) — MoE híbrido
  # Mamba-2 + LatentMoE (arch nemotron_h_moe: 88 blocos = 8 attention
  # [KV heads 2] + 40 SSM + 40 MoE [496 experts totais, 9 ativos]).
  # VLM: mmproj C-RADIO v4-H (1,7 GB). Ctx nativo 262144.
  # Requer llama.cpp >= PR ggml-org#30520 (merge 2026-10-15) — imagem
  # stock atualizada p/ build 11681 (0.7.0-dev 5e03a1ff).
  # Experts IQ2: 431 MiB/camada; -ncmoe 32 deixa ~7 GiB de pesos na GPU.
  # MoE híbrido: --load-mode none (regra 2). DFlash drafter LiLiCorr
  # (1 GB, draft separado → -ctkd/-ctvd f16, regra 5).
  # Sampling do model card: temp 1.0 / top-p 0.95.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Nemotron-3.5-Bolt 74B-A9B (NVIDIA) — arch nemotron_h_moe (88 blocos
  # híbridos Mamba/atenção; KV pequeno → 128k ok). GGUF "24GB" + mmproj
  # + draft DFlash LiLiCorr.
  # Receita VALIDADA 2026-10-26 (serving real):
  # - ncmoe 74/88: com o ncmoe 32 original a carga OOMava (experts de ~56
  #   blocos ficavam na GPU). mmproj na CPU (--no-mmproj-offload, -1,7 GB)
  #   para caber tudo @128k.
  # - SEM draft: o DFlash medido com aceitação ~27% dava decode 9,2 tok/s
  #   (overhead > ganho); sem draft: decode ~19 tok/s, prefill ~560 tok/s.
  #   GGUF do draft (952 MB) segue em disco para reteste.
  # - ub 2048 (com draft era ub 1024 — compute buffer).
  # decode ~19 tok/s, prefill ~560 tok/s @2k; VRAM ~11060 MiB
  # (~1,2 GB de folga). temp 1.0 / top-p 0.95 (model card).
  # ---------------------------------------------------------------------
  Nemotron3.5_Bolt_74B:
    cmd: |
      ${docker-pdcache}
      -m /models/Nemotron3.5-Bolt-74B-A9B-24GB/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
      --mmproj /models/Nemotron3.5-Bolt-74B-A9B-24GB/mmproj-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
      --no-mmproj-offload
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 74
      -b 4096 -ub 2048
      --temp 1.0 --top-p 0.95
    cmdStop: ${docker-stop}
    ttl: 1800

  # ---------------------------------------------------------------------
  # Qwen 3.6 35B Uncensored Aggressive (HauhauCS) — multimodal,
  # MoE (28 camadas na CPU). Otimizado 2026-10-14 p/ teto de 10 GB:
  # -ncmoe 28 (era 32): prefill 9730 tok ~1060->~1150 tok/s (+9%);
  # decode ~39 tok/s (CPU-bound, sem ganho mensurável dentro do teto).
  # VRAM processo ~9770-9830 MiB (< 10 GiB); total c/ desktop ~10,5 GB.
  # SEM spec decoding: o GGUF não contém tensors nextn/MTP (verificado no
  # header) — --spec-type draft-mtp inaplicável; draft externo descartado
  # (precedente DSpark: aceitação ~10%, mais lento). --moe-cache-mib
  # testado (1024 MiB): decode 38,7->30,5 tok/s — rejeitado. -t 6 e -tb 6
  # testados: sem ganho/piora — mantido -t 5 do macro.
  # ---------------------------------------------------------------------
  Qwen3.6_35B_A3B_Hauhau_Aggressive:
    cmd: |
      ${docker-pdcache}
      -m /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      --mmproj /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 29
      -b 4096 -ub 2048
    cmdStop: ${docker-stop}
    ttl: 1800

  # =====================================================================
  # Batch 2026-10-26 — alternativas ao Qwen3.6 35B (todos arch
  # qwen3_5_moe). Receita padrão: pdcache + KV q4_0 (default 2026-10-27) + --load-mode none +
  # -ncmoe + ub 2048 (regras 2/7/10). ncmoe 31 (paridade Qwen3.6 35B,
  # 40 camadas) — ajustar por carga real.
  # Raon-1 mini 30B (KRAFTON) AVALIADO E BLOQUEADO: arch `raon1_mini`
  # NÃO existe no llama.cpp master (nem fork conhecido) — sem engine.
  # K2-Horizon 36B MoVA REMOVIDO em 2026-10-26: KV de 192 KiB/tok
  # (48 camadas full-attention + MoVA fixo na GPU) limitava o ctx a 40k
  # — abaixo do floor de 128k (política: modelo que não atende 128k sai
  # do zoo).
  # =====================================================================

  # ---------------------------------------------------------------------
  # Sage-A1.5 35B-A3B (InternScience) — qwen3_5_moe multimodal (visor
  # SigLIP-ish 27 camadas). GGUF oficial Q4_K_M + mmproj. Sampling do
  # model card: temp 1.0 / top-p 0.95 / top-k 20 / min-p 0.0 /
  # presence-penalty 1.5 / rep 1.0.
  # ---------------------------------------------------------------------
  SageA1.5_35B:
    cmd: |
      ${docker-pdcache}
      -m /models/Sage-A1.5-Q4_K_M/Sage-A1.5-Q4_K_M.gguf
      --mmproj /models/Sage-A1.5-Q4_K_M/Sage-A1.5-mmproj.gguf
      --load-mode none
      -c 131072 -ngl 99 -ncmoe 31
      -b 4096 -ub 2048
